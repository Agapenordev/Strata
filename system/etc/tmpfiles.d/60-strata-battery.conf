# Strata (--battery-care): Lenovo IdeaPad "conservation mode".
# The battery stops charging around 60-80 % (firmware decides) while on AC,
# which greatly extends its lifespan on a laptop that is mostly plugged in.
# Turn it off for a trip:  echo 0 | sudo tee /sys/bus/platform/drivers/ideapad_acpi/VPC2004:*/conservation_mode
w /sys/bus/platform/drivers/ideapad_acpi/VPC2004:*/conservation_mode - - - - 1
