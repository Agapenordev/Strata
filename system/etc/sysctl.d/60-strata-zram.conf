# Strata (--zram): VM tuning for compressed RAM swap (kernel/Fedora/ChromeOS guidance).
# zram is far faster than disk, so prefer swapping cold pages over dropping file cache.
vm.swappiness = 180
# Read single pages from zram; readahead clustering only helps rotating disks.
vm.page-cluster = 0
# Keep a little more memory free so allocation spikes (games, compiles) do not stall.
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
