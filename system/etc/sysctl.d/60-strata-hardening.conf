# Strata (--system): small, desktop-safe kernel hardening. No performance cost.
# Hide kernel log and kernel pointers from unprivileged users (anti-exploit info leaks).
kernel.dmesg_restrict = 1
kernel.kptr_restrict = 2
# Processes may only debug (ptrace) their own children; gdb/strace via sudo still work.
kernel.yama.ptrace_scope = 1
# Never dump memory of setuid programs (pairs with Storage=none for coredumps).
fs.suid_dumpable = 0
